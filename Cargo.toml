[package]
name = "mirror_scanner_gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"

[dependencies]
config = "0.15.18"
iced = { version = "0.12", features = ["tokio", "image"] }
serde = { version = "1.0.228", features = ["derive"] }
serialport = "4.8.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "chrono"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "time"] }
winapi = { version = "0.3", features = ["winnt", "minwindef", "windef"] }
widestring = "1.0"
# ini = "1.3"  # Используем собственный парсер INI
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
flate2 = "1.0"
rand = "0.8"

